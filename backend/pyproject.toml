[project]
name = "openvitae-backend"
version = "0.1.0"
description = "OpenVitae backend — config-driven CV site & publication manager API"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "pydantic[email]>=2.10.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "boto3>=1.35.92",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI intentionally uses Depends()/File()/Query() as default values.
ignore = ["B008"]
