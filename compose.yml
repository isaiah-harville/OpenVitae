name: openvitae

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvitae}
      POSTGRES_DB: ${POSTGRES_DB:-openvitae}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openvitae}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openvitae}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-openvitae-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openvitae:openvitae@db:5432/openvitae}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AUTH_MODE: ${AUTH_MODE:-jwt}
      PROXY_AUTH_EMAIL_HEADER: ${PROXY_AUTH_EMAIL_HEADER:-Remote-Email}
      PROXY_AUTH_GROUPS_HEADER: ${PROXY_AUTH_GROUPS_HEADER:-Remote-Groups}
      PROXY_AUTH_REQUIRED_GROUP: ${PROXY_AUTH_REQUIRED_GROUP:-}
      PROXY_AUTH_AUTO_PROVISION: ${PROXY_AUTH_AUTO_PROVISION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@openvitae.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openvitae}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openvitae-secret}
      S3_BUCKET: ${S3_BUCKET:-openvitae}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # SSR calls the API directly; browser calls /api are proxied here at runtime.
      SERVER_API_URL: ${SERVER_API_URL:-http://api:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
