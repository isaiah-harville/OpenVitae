name: openvitae

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvitae}
      POSTGRES_DB: ${POSTGRES_DB:-openvitae}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openvitae}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  s3:
    # S3-compatible object storage for headshots, screenshots, and papers: SeaweedFS
    # in single-process "mini" mode. (MinIO no longer publishes container images.)
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-s3.port=9000", "-bucket=${S3_BUCKET:-openvitae}"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-openvitae}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-openvitae-secret}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000" # S3 API
    networks:
      default:
        # Older .env files point S3_ENDPOINT_URL at http://minio:9000.
        aliases: [minio]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openvitae:openvitae@db:5432/openvitae}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      API_TOKEN: ${API_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-jwt}
      PROXY_AUTH_EMAIL_HEADER: ${PROXY_AUTH_EMAIL_HEADER:-Remote-Email}
      PROXY_AUTH_GROUPS_HEADER: ${PROXY_AUTH_GROUPS_HEADER:-Remote-Groups}
      PROXY_AUTH_REQUIRED_GROUP: ${PROXY_AUTH_REQUIRED_GROUP:-}
      PROXY_AUTH_AUTO_PROVISION: ${PROXY_AUTH_AUTO_PROVISION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@openvitae.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openvitae}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openvitae-secret}
      S3_BUCKET: ${S3_BUCKET:-openvitae}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # SSR calls the API directly; browser calls /api are proxied here at runtime.
      SERVER_API_URL: ${SERVER_API_URL:-http://api:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  s3data:
