{{- if .Values.minio.enabled }}
{{- /* In-cluster S3 store. Named "minio" for compatibility; it runs SeaweedFS. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openvitae.minio.fullname" . }}
  labels:
    {{- include "openvitae.labels" . | nindent 4 }}
    {{- include "openvitae.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  selector:
    {{- include "openvitae.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openvitae.minio.fullname" . }}
  labels:
    {{- include "openvitae.labels" . | nindent 4 }}
    {{- include "openvitae.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  serviceName: {{ include "openvitae.minio.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openvitae.selectorLabels" (dict "ctx" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openvitae.selectorLabels" (dict "ctx" . "component" "minio") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # SeaweedFS in single-process "mini" mode, serving S3 on :9000. The values
        # keep the `minio` name so existing overrides continue to apply.
        - name: s3
          image: {{ .Values.minio.image | quote }}
          args:
            - mini
            - -dir=/data
            - -s3.port=9000
            - -bucket={{ .Values.minio.bucket }}
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.minio.auth.rootPassword | quote }}
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          {{- if .Values.minio.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if not .Values.minio.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.minio.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size | quote }}
        {{- include "openvitae.storageClass" (dict "ctx" . "sc" .Values.minio.persistence.storageClass) | nindent 8 }}
  {{- end }}
{{- end }}
