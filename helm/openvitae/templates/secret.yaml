{{- if not .Values.existingSecret }}
{{- $dbUrl := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $dbUrl = printf "postgresql+psycopg2://%s:%s@%s:5432/%s" .Values.postgres.auth.username .Values.postgres.auth.password (include "openvitae.postgres.fullname" .) .Values.postgres.auth.database -}}
{{- else -}}
{{- $dbUrl = required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url -}}
{{- end -}}
{{- $s3Access := ternary .Values.minio.auth.rootUser .Values.externalS3.accessKey .Values.minio.enabled -}}
{{- $s3Secret := ternary .Values.minio.auth.rootPassword .Values.externalS3.secretKey .Values.minio.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvitae.fullname" . }}
  labels:
    {{- include "openvitae.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.admin.password | quote }}
  S3_ACCESS_KEY: {{ $s3Access | quote }}
  S3_SECRET_KEY: {{ $s3Secret | quote }}
{{- end }}
