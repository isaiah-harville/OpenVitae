[project]
name = "openvitae-mcp"
version = "0.1.0"
description = "MCP server that lets LLM clients read and edit an OpenVitae site through its API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.scripts]
openvitae-mcp = "openvitae_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvitae_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
